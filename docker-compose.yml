# Optional local MongoDB replica set for development and tests. The API can
# instead connect to MongoDB Atlas with MONGODB_URI; Docker is not required.
services:
  mongo:
    image: mongo:7
    container_name: food-marketplace-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: ''rs0'', members: [{_id: 0, host: ''localhost:27017''}]}).ok }"'
        ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

volumes:
  mongo_data:
